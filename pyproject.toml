[project]
name = "churn-platform"
version = "0.1.0"
description = "E-Commerce Customer Churn Prediction & Analysis Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data & EDA
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "imbalanced-learn>=0.12",
    "shap>=0.46,<0.51",
    "numba>=0.59",
    "llvmlite>=0.42",
    # MLflow
    "mlflow>=2.11",
    # API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    # Dashboard
    "dash>=2.16",
    "dash-bootstrap-components>=1.5",
    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.29",
    # Utils
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
